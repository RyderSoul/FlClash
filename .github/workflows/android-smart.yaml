name: flsmart Android APK

on:
  push:
    branches: [custom/smart-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flsmart-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.output.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare Smart core
        run: bash tool/prepare_smart_core.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure persistent signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the repository Actions secret $name before building."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/local.properties

      - name: Fetch pinned CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/.smart-mihomo/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Check Go wrapper and Android core
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go mod tidy -diff
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform

      - name: Test Smart core integration
        working-directory: core/.smart-mihomo
        env:
          CGO_ENABLED: 0
        run: go test ./adapter/outboundgroup ./adapter/provider ./component/smart/... ./component/updater ./transport/snell ./adapter/outbound ./listener/snell ./dns ./component/proxydialer ./tunnel/statistic

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate models
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/l10n

      - name: Collect generated source
        run: |
          git add -N -- lib/models/generated lib/providers/generated lib/database/generated lib/l10n
          git diff --binary HEAD -- lib/models/generated lib/providers/generated \
            lib/database/generated lib/l10n > /tmp/generated-source.patch

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: flsmart-generated-source-${{ github.run_number }}
          path: /tmp/generated-source.patch
          retention-days: 7

      - name: Analyze and test Flutter
        env:
          NODE_TRAFFIC_PREVIEW_DIR: /tmp/flsmart-preview
        run: |
          dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
          flutter analyze --no-fatal-infos
          flutter test test/enum/enum_test.dart test/models/config_test.dart \
            test/common/app_update_test.dart test/common/migration_test.dart \
            test/common/compute_test.dart test/common/task_test.dart \
            test/common/proxy_chain_test.dart test/common/profile_binding_test.dart test/common/smart_usage_test.dart \
            test/providers/custom_import_test.dart test/providers/proxies_action_test.dart \
            test/providers/state_derived_test.dart test/providers/config_test.dart \
            test/l10n test/lint \
            test/core/protocol_contract_test.dart test/views/proxies_list_test.dart \
            test/widgets/proxies_tab_test.dart test/widgets/proxies_list_test.dart \
            test/views/dashboard test/views/smart_features_test.dart test/views/profile_bindings_test.dart \
            test/providers/setup_action_test.dart test/features/profile_views_test.dart \
            test/database/generated_contract_test.dart
          dart run tool/test.dart test/widgets -- --reporter expanded

      - name: Upload panel previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flsmart-panel-preview-${{ github.run_number }}
          path: /tmp/flsmart-preview/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Build ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = true' pubspec.yaml
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number "$((4000 + GITHUB_RUN_NUMBER))"

      - name: Test Android components
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Verify APK identity and collect output
        id: output
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$apkanalyzer" manifest application-id "$apk")" = com.rydersoul.flclash
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify "$apk"
          mkdir -p dist
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp "$apk" "dist/flsmart-${version}-android-arm64-v8a.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp core/smart-source.json dist/
          cp /tmp/flsmart-preview/*.png dist/
          git diff --binary HEAD -- lib/models/generated lib/providers/generated \
            lib/database/generated lib/l10n > dist/generated-source.patch
          git rev-parse HEAD > dist/source-commit.txt
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flsmart-android-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties

  release:
    needs: apk
    if: github.ref == 'refs/heads/custom/smart-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: flsmart-android-arm64-${{ github.run_number }}
          path: dist

      - name: Prepare Chinese release notes
        env:
          FLSMART_VERSION: ${{ needs.apk.outputs.version }}
        run: python3 tool/flsmart_release_notes.py

      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          FLSMART_VERSION: ${{ needs.apk.outputs.version }}
        run: |
          set -euo pipefail
          existing=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          resume_draft=false
          if echo "$existing" | grep -Fxq "$FLSMART_VERSION"; then
            draft=$(gh release view "$FLSMART_VERSION" --json isDraft --jq .isDraft)
            if [[ "$draft" != true ]]; then
              echo "Release $FLSMART_VERSION already exists; keep its APK and notes."
              exit 0
            fi
            target=$(gh release view "$FLSMART_VERSION" --json targetCommitish --jq .targetCommitish)
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing draft targets a different source commit."
              exit 1
            fi
            resume_draft=true
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          assets=(dist/*.apk dist/SHA256SUMS dist/source-commit.txt dist/smart-source.json dist/*.png)
          if [[ -s dist/generated-source.patch ]]; then
            assets+=(dist/generated-source.patch)
          fi
          if [[ "$resume_draft" == true ]]; then
            gh release upload "$FLSMART_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$FLSMART_VERSION" --target "$GITHUB_SHA" \
              --title "flsmart $FLSMART_VERSION" --draft --notes-file dist/release.md \
              "${assets[@]}"
          fi
          gh release edit "$FLSMART_VERSION" --draft=false --latest
