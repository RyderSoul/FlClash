name: flsmart Android APK

on:
  push:
    branches: [custom/smart-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flsmart-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare Smart core
        run: bash tool/prepare_smart_core.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure persistent signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the repository Actions secret $name before building."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/local.properties

      - name: Fetch pinned CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/.smart-mihomo/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Check Go wrapper and Android core
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go mod tidy -diff
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform

      - name: Test Smart core integration
        working-directory: core/.smart-mihomo
        env:
          CGO_ENABLED: 0
        run: go test ./adapter/outboundgroup ./component/smart/... ./component/updater

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate models
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test Flutter
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/enum/enum_test.dart test/models/config_test.dart \
            test/common/app_update_test.dart \
            test/common/compute_test.dart \
            test/providers/custom_import_test.dart test/providers/proxies_action_test.dart \
            test/core/protocol_contract_test.dart test/views/proxies_list_test.dart \
            test/widgets/proxies_tab_test.dart test/widgets/proxies_list_test.dart

      - name: Build ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = true' pubspec.yaml
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Test Android components
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Verify APK identity and collect output
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$apkanalyzer" manifest application-id "$apk")" = com.rydersoul.flclash
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/flsmart-${GITHUB_RUN_NUMBER}-android-arm64-v8a.apk"
          cp core/smart-source.json dist/
          git diff --binary HEAD -- lib/models/generated lib/providers/generated \
            lib/database/generated > dist/generated-source.patch
          git rev-parse HEAD > dist/source-commit.txt
          (cd dist && sha256sum ./*.apk > SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flsmart-android-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties
